<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Task Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Task Manager</h1>
        <h2>Register</h2>
        <input id="reg_username" placeholder="Username">
        <input id="reg_email" placeholder="Email">
        <input id="reg_password" type="password" placeholder="Password">
        <button onclick="register()">Register</button>

        <h2>Login</h2>
        <input id="login_email" placeholder="Email">
        <input id="login_password" type="password" placeholder="Password">
        <button onclick="login()">Login</button>

        <h2>Task</h2>
        <input id="task_title" placeholder="Task title">
        <button onclick="createTask()">Add Task</button>

        <div id="tasks">
        </div>
    </div>

<script src="app.js">

</script>

</body>
</html>
